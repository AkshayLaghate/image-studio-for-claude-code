name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  helper:
    name: Helper (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Helper tests (against a stand-in Codex CLI)
        run: node --test tests/helper.test.mjs

  mod:
    name: Mod (validate and test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the plugin and marketplace
        run: claude plugin validate .
      - name: Mod tests
        run: claude plugin test .
